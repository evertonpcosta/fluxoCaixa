global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: lancamentos
    metrics_path: /metrics
    static_configs:
      - targets: ["lancamentos:8001"]
        labels:
          service: lancamentos

  - job_name: consolidado
    metrics_path: /metrics
    static_configs:
      - targets: ["consolidado:8002"]
        labels:
          service: consolidado

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq
