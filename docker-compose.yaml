name: fluxo-caixa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo
      POSTGRES_DB: fluxo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo -d fluxo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  lancamentos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: lancamentos
    environment:
      DATABASE_URL: postgresql+psycopg://fluxo:fluxo@postgres:5432/lancamentos
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:-}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  consolidado:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: consolidado
    environment:
      DATABASE_URL: postgresql+psycopg://fluxo:fluxo@postgres:5432/consolidado
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:-}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
